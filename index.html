<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brolly Enterprise v4 — 30-Agent Profit Army</title>
<style>
:root{--bg:#050508;--card:#0f0f14;--border:#1e1e2e;--text:#e2e2e8;--text2:#8b8b9e;--text3:#555568;--blue:#3b82f6;--red:#ef4444;--green:#22c55e;--purple:#a855f7;--gray:#6b7280;--gold:#f59e0b;--cyan:#06b6d4;--pink:#ec4899;--orange:#f97316;--teal:#14b8a6;--indigo:#6366f1;--yellow:#eab308;--amber:#d97706;--lime:#84cc16;--rose:#f43f5e;--sky:#0ea5e9;--violet:#8b5cf6;--emerald:#10b981;--slate:#64748b}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:12px;line-height:1.4;min-height:100vh;-webkit-text-size-adjust:100%;overflow-x:hidden}
#app{max-width:1100px;margin:0 auto;position:relative}
#particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;width:3px;height:3px;background:var(--gold);border-radius:50%;opacity:.3;animation:floatParticle 8s infinite ease-in-out}
@keyframes floatParticle{0%,100%{transform:translateY(0) translateX(0);opacity:.1}25%{transform:translateY(-30px) translateX(10px);opacity:.4}50%{transform:translateY(-60px) translateX(-10px);opacity:.2}75%{transform:translateY(-30px) translateX(15px);opacity:.3}}
header{position:relative;z-index:1;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
h1{font-size:24px;font-weight:800;letter-spacing:-.8px;background:linear-gradient(90deg,var(--gold),var(--orange),var(--red));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:titleShine 3s infinite}
@keyframes titleShine{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}
.sub{font-size:11px;color:var(--text3);margin-top:2px}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);padding:4px 10px;border-radius:20px;animation:glowPulse 2s infinite}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.2)}50%{box-shadow:0 0 10px 2px rgba(34,197,94,.1)}}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.metrics{display:flex;gap:16px;font-size:13px;color:var(--text2);flex-wrap:wrap;margin-top:4px}
.metrics strong{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.weather-bar{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:12px;position:relative;z-index:1;overflow:hidden}
.weather-bar::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--sky),var(--blue))}
.weather-icon{font-size:20px}
.weather-loc{font-weight:600}
.weather-temp{font-size:14px;font-weight:700;color:var(--gold)}
.weather-desc{color:var(--text3)}
.crypto-ticker{display:flex;gap:16px;overflow-x:auto;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:14px;position:relative;z-index:1}
.crypto-item{display:flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap;background:var(--bg);padding:6px 12px;border-radius:8px;border:1px solid var(--border)}
.crypto-price{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.crypto-change{font-size:10px;font-weight:600}
.crypto-up{color:var(--green)}.crypto-down{color:var(--red)}
.profit-boost{position:relative;z-index:1;background:linear-gradient(135deg,rgba(245,158,11,.1),rgba(239,68,68,.1));border:1px solid rgba(245,158,11,.2);border-radius:16px;padding:16px;text-align:center;margin-bottom:14px;overflow:hidden}
.profit-boost::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(245,158,11,.04),transparent);animation:shimmer 6s infinite}
@keyframes shimmer{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.profit-boost-text{font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.5px;position:relative;z-index:1}
.profit-boost-sub{font-size:11px;color:var(--text3);margin-top:4px;position:relative;z-index:1}
.tabs{position:relative;z-index:1;display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.tab-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:8px 14px;border-radius:10px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;flex:1;text-align:center;transition:all .2s}
.tab-btn.active{background:var(--card);color:var(--text);border-color:var(--blue)}
.tab-btn:hover:not(.active){border-color:var(--text3)}
.tab-panel{display:none;position:relative;z-index:1}
.tab-panel.active{display:block;animation:panelIn .3s}
@keyframes panelIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;position:relative;z-index:1}
.section-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:1.5px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:14px;border-radius:2px;background:var(--blue)}
.zone-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:700px){.zone-grid{grid-template-columns:1fr 1fr}}
.zone{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;position:relative;overflow:hidden;transition:border-color .3s}
.zone:hover{border-color:var(--blue)}
.zone::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:linear-gradient(180deg,var(--blue),var(--purple))}
.zone-name{font-size:14px;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.zone-icon{font-size:18px}
.facilities{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tag{font-size:10px;color:var(--text2);background:var(--card);border:1px solid var(--border);padding:3px 8px;border-radius:6px;transition:all .2s}
.tag:hover{border-color:var(--blue);color:var(--text)}
.tag.hot{color:var(--green);border-color:var(--green);animation:tagPulse 2s infinite}
@keyframes tagPulse{0%,100%{box-shadow:0 0 0 0 rgba(34,197,94,.1)}50%{box-shadow:0 0 8px 1px rgba(34,197,94,.15)}}
.agents{display:flex;flex-direction:column;gap:8px}
.agent-chip{display:flex;align-items:center;gap:10px;padding:8px;background:rgba(255,255,255,.02);border-radius:10px;transition:all .2s;cursor:pointer;border:1px solid transparent}
.agent-chip:hover{background:rgba(255,255,255,.06);border-color:var(--border);transform:translateX(4px)}
.agent-chip.working{background:rgba(34,197,94,.05);border-color:rgba(34,197,94,.15)}
.agent-chip.idle{background:rgba(245,158,11,.05);border-color:rgba(245,158,11,.15)}
.agent-chip.break{background:rgba(239,68,68,.05);border-color:rgba(239,68,68,.15)}
.agent-avatar-wrap{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden}
.agent-avatar-wrap svg{width:100%;height:100%}
.agent-avatar-wrap .status-ring{position:absolute;inset:-2px;border-radius:12px;border:2px solid transparent;animation:ringPulse 2s infinite}
.agent-chip.working .status-ring{border-color:var(--green)}
.agent-chip.idle .status-ring{border-color:var(--gold)}
.agent-chip.break .status-ring{border-color:var(--red)}
@keyframes ringPulse{0%,100%{opacity:1}50%{opacity:.3}}
.agent-chip-name{font-size:12px;font-weight:600}
.agent-chip-task{font-size:10px;color:var(--text3)}
.agent-chip-earn{font-size:10px;color:var(--green);font-weight:600;margin-left:auto}
.work-indicator{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px}
.work-indicator.working{background:var(--green);animation:blink 1s infinite}
.work-indicator.idle{background:var(--gold)}
.work-indicator.break{background:var(--red);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.crew-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.crew-grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.crew-grid{grid-template-columns:1fr 1fr 1fr}}
.crew-card{background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:14px;position:relative;overflow:hidden;transition:all .3s;cursor:pointer}
.crew-card:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 8px 32px rgba(59,130,246,.08)}
.crew-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple));opacity:0;transition:opacity .3s}
.crew-card:hover::before{opacity:1}
.crew-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.crew-avatar{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;border:2px solid var(--border);transition:border-color .3s}
.crew-avatar svg{width:100%;height:100%}
.crew-card:hover .crew-avatar{border-color:var(--blue)}
.crew-info{flex:1;min-width:0}
.crew-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew-role{font-size:10px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crew-status-row{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10px}
.crew-status-text{color:var(--green)}
.crew-status-text.idle{color:var(--gold)}
.crew-status-text.break{color:var(--red)}
.crew-last{font-size:9px;color:var(--text3)}
.crew-vitals{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.vital-item{font-size:9px}
.vital-label{display:flex;justify-content:space-between;margin-bottom:2px}
.vital-label span:first-child{color:var(--text3)}
.vital-label span:last-child{color:var(--text);font-weight:600}
}
.vital-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.vital-fill{height:100%;border-radius:2px;transition:width .6s ease-out}
.crew-task{font-size:11px;color:var(--text2);background:var(--card);padding:8px;border-radius:8px;margin-bottom:8px}
.crew-rev{font-size:13px;font-weight:700;margin-top:6px;text-align:right}
.reward-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.reward-btn{font-size:9px;padding:5px 10px;border-radius:8px;border:none;cursor:pointer;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:3px}
.reward-btn:hover{transform:scale(1.08);filter:brightness(1.2)}
.reward-btn.coffee{background:linear-gradient(135deg,#6f4e37,#8b6914);color:#fff}
.reward-btn.energy{background:linear-gradient(135deg,#ef4444,#f97316);color:#fff}
.reward-btn.brain{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff}
.reward-btn.money{background:linear-gradient(135deg,#22c55e,#14b8a6);color:#fff}
.reward-btn.vacation{background:linear-gradient(135deg,#a855f7,#ec4899);color:#fff}
.stream-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;transition:all .2s;position:relative;overflow:hidden}
.stream-item:hover{background:rgba(255,255,255,.03);border-color:var(--blue);transform:translateX(4px)}
.stream-item::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;background:var(--green);opacity:0;transition:opacity .2s}
.stream-item:hover::before{opacity:1}
.stream-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--card);flex-shrink:0}
.stream-info{flex:1;min-width:0}
.stream-name{font-size:13px;font-weight:600}
.stream-desc{font-size:11px;color:var(--text3)}
.stream-status{font-size:10px;color:var(--text3);margin-top:2px}
.stream-rev{font-size:13px;font-weight:700;color:var(--green);white-space:nowrap;flex-shrink:0}
.stream-link{font-size:10px;color:var(--blue);text-decoration:none;margin-top:2px;display:inline-block}
.stream-link:hover{text-decoration:underline}
.leaderboard{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.lb-item{flex-shrink:0;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 14px;text-align:center;min-width:100px;transition:all .2s}
.lb-item:hover{border-color:var(--gold);transform:translateY(-2px)}
.lb-rank{font-size:10px;color:var(--gold);font-weight:700}
.lb-name{font-size:12px;font-weight:600;margin-top:2px}
.lb-earn{font-size:11px;color:var(--green);font-weight:700;margin-top:2px}
.treasury-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:600px){.treasury-grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.t-card{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(168,85,247,.08));border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;position:relative;overflow:hidden;transition:all .2s}
.t-card:hover{transform:translateY(-2px);border-color:var(--blue)}
.t-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.t-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.t-val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.t-change{font-size:10px;color:var(--green);margin-top:4px}
.graph-wrap{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:14px;position:relative}
.graph-canvas{width:100%;height:180px}
.graph-legend{display:flex;gap:12px;justify-content:center;font-size:10px;color:var(--text3);margin-top:6px;flex-wrap:wrap}
.graph-legend span{display:flex;align-items:center;gap:4px}
.legend-dot{width:8px;height:8px;border-radius:2px}
.revenue-summary{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
@media(min-width:500px){.revenue-summary{grid-template-columns:1fr 1fr 1fr 1fr}}
.rev-sum-item{background:var(--bg);border-radius:8px;padding:10px;text-align:center;border:1px solid var(--border);transition:all .2s}
.rev-sum-item:hover{border-color:var(--blue)}
.rev-sum-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.rev-sum-val{font-size:15px;font-weight:700;margin-top:3px}
.bank-grid{display:grid;grid-template-columns:1fr;gap:8px}
@media(min-width:600px){.bank-grid{grid-template-columns:1fr 1fr}}
.bank-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg);border:1px solid var(--border);border-radius:10px;transition:all .2s}
.bank-card:hover{background:rgba(255,255,255,.03);border-color:var(--blue)}
.bank-logo{width:36px;height:36px;border-radius:8px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:18px}
.bank-info{flex:1}
.bank-name{font-size:13px;font-weight:600}
.bank-status{font-size:11px;color:var(--text3)}
.bank-btn{font-size:11px;color:var(--blue);background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.2);padding:4px 10px;border-radius:6px;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-block}
.bank-btn:hover{background:rgba(59,130,246,.2)}
.store-grid{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:600px){.store-grid{grid-template-columns:1fr 1fr}}
.store-card{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;transition:all .2s}
.store-card:hover{border-color:var(--purple);transform:translateY(-2px)}
.store-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.store-icon{width:40px;height:40px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:20px}
.store-name{font-size:14px;font-weight:600}
.store-status{font-size:11px;color:var(--text3)}
.store-link{font-size:11px;color:var(--purple);text-decoration:none;font-weight:500}
.store-link:hover{text-decoration:underline}
.store-rev{font-size:12px;color:var(--green);font-weight:700;margin-top:6px}
.chat-box{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px;height:240px;overflow-y:auto;font-size:12px;scroll-behavior:smooth;position:relative}
.chat-line{margin-bottom:8px;animation:chatPop .3s cubic-bezier(.175,.885,.32,1.275)}
@keyframes chatPop{from{opacity:0;transform:scale(.9) translateY(5px)}to{opacity:1;transform:scale(1) translateY(0)}}
.chat-name{font-weight:600}
.chat-time{color:var(--text3);font-size:10px;margin-right:6px}
.chat-input-wrap{display:flex;gap:8px;margin-top:10px}
.chat-input{flex:1;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:10px;font-size:13px;font-family:inherit}
.chat-input:focus{outline:none;border-color:var(--blue)}
.chat-send{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;border:none;padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s}
.chat-send:hover{opacity:.85}
.typing-indicator{display:flex;gap:4px;align-items:center;padding:6px 12px;background:var(--card);border-radius:10px;width:fit-content;margin-bottom:8px}
.typing-indicator span{width:6px;height:6px;background:var(--text3);border-radius:50%;animation:typingBounce 1.4s infinite ease-in-out both}
.typing-indicator span:nth-child(1){animation-delay:-.32s}
.typing-indicator span:nth-child(2){animation-delay:-.16s}
@keyframes typingBounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
#thought-container{position:fixed;bottom:20px;right:20px;z-index:50;display:flex;flex-direction:column;gap:8px;max-width:280px;pointer-events:none}
.thought-bubble{pointer-events:auto;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;font-size:11px;color:var(--text2);animation:thoughtPop .5s cubic-bezier(.175,.885,.32,1.275);box-shadow:0 4px 20px rgba(0,0,0,.3);position:relative;max-width:260px}
.thought-bubble::before{content:'💭';position:absolute;top:-10px;left:12px;font-size:14px;background:var(--bg);padding:0 4px;border-radius:4px}
.thought-bubble::after{content:'';position:absolute;bottom:-6px;right:20px;width:12px;height:12px;background:var(--card);border-right:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg)}
@keyframes thoughtPop{from{opacity:0;transform:translateY(20px) scale(.8)}to{opacity:1;transform:translateY(0) scale(1)}}
.thought-agent{color:var(--gold);font-weight:700}
.thought-close{position:absolute;top:4px;right:8px;font-size:14px;color:var(--text3);cursor:pointer;line-height:1}
.thought-close:hover{color:var(--text)}
.log-item{padding:10px 0;border-bottom:1px solid var(--border);font-size:12px;display:flex;align-items:flex-start;gap:8px;animation:logSlide .3s}
.log-item:last-child{border-bottom:none}
@keyframes logSlide{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.log-time{color:var(--text3);font-size:10px;white-space:nowrap;min-width:50px}
.log-icon{font-size:14px;margin-right:2px}
.agent-modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;backdrop-filter:blur(4px)}
.agent-modal.active{display:flex}
.agent-modal-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;animation:modalIn .3s;position:relative}
@keyframes modalIn{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.modal-close{position:absolute;top:10px;right:14px;font-size:22px;color:var(--text3);cursor:pointer;background:none;border:none;transition:color .2s}
.modal-close:hover{color:var(--text)}
.modal-avatar{width:72px;height:72px;border-radius:16px;overflow:hidden;margin:0 auto 12px;border:3px solid var(--blue);position:relative}
.modal-avatar svg{width:100%;height:100%}
.modal-status-ring{position:absolute;inset:-4px;border-radius:20px;border:2px solid var(--green);animation:ringPulse 2s infinite}
.vital-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.modal-task{background:var(--bg);border-radius:10px;padding:10px;font-size:12px;color:var(--text2);margin:10px 0}
.modal-thought{background:var(--bg);border-radius:10px;padding:10px;font-size:11px;color:var(--text2);border-left:3px solid var(--gold)}
.float-reward{position:fixed;pointer-events:none;font-size:18px;font-weight:700;animation:floatUp 1.5s ease-out forwards;z-index:200;text-shadow:0 2px 10px rgba(0,0,0,.5)}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-100px) scale(1.4)}}
.money-particle{position:fixed;pointer-events:none;font-size:16px;z-index:5;animation:moneyFall 3s linear forwards}
@keyframes moneyFall{0%{transform:translateY(-20px) rotate(0deg);opacity:1}100%{transform:translateY(100vh) rotate(360deg);opacity:0}}
.max-badge{font-size:9px;color:var(--gold);background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);padding:2px 6px;border-radius:4px;margin-left:6px;text-transform:uppercase;letter-spacing:.5px;animation:maxGlow 2s infinite}
@keyframes maxGlow{0%,100%{box-shadow:0 0 0 0 rgba(245,158,11,.1)}50%{box-shadow:0 0 8px 1px rgba(245,158,11,.15)}}
.upload-zone{border:2px dashed var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;transition:all .2s}
.upload-zone:hover{border-color:var(--blue);background:rgba(59,130,246,.03)}
.upload-zone input{display:none}
.platform-item{display:flex;align-items:center;gap:10px;padding:10px;background:var(--bg);border-radius:8px;margin-bottom:6px;border:1px solid var(--border);transition:all .2s}
.platform-item:hover{border-color:var(--blue)}
.platform-info{flex:1}
.platform-name{font-size:12px;font-weight:600}
.platform-pending{font-size:10px;color:var(--text3)}
.platform-bal{font-size:13px;font-weight:700;color:var(--green)}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text3)}
@media(max-width:500px){h1{font-size:18px}.metrics{gap:10px;font-size:11px}.tabs{gap:4px}.tab-btn{padding:6px 10px;font-size:11px}}
</style>
</head>
