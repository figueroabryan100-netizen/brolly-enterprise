<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brolly Enterprise — 24/7 Command</title>
<style>
:root{--bg:#050508;--card:#0f0f14;--border:#1e1e2e;--text:#e2e2e8;--text2:#8b8b9e;--text3:#555568;--blue:#3b82f6;--red:#ef4444;--green:#22c55e;--purple:#a855f7;--gray:#6b7280;--gold:#f59e0b;--cyan:#06b6d4;--pink:#ec4899;--orange:#f97316;--teal:#14b8a6}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:12px;line-height:1.4;min-height:100vh;-webkit-text-size-adjust:100%}
#app{max-width:960px;margin:0 auto}
header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
h1{font-size:22px;font-weight:700;letter-spacing:-.5px;background:linear-gradient(90deg,var(--text),var(--text2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:11px;color:var(--text3);margin-top:2px}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--green);background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.2);padding:4px 10px;border-radius:20px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.metrics{display:flex;gap:16px;font-size:13px;color:var(--text2);flex-wrap:wrap;margin-top:4px}
.metrics strong{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px}
.section-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:1.5px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:14px;border-radius:2px;background:var(--blue)}
.treasury-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(min-width:600px){.treasury-grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.t-card{background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(168,85,247,.08));border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;position:relative;overflow:hidden}
.t-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.t-label{font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}
.t-val{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.t-change{font-size:10px;color:var(--green);margin-top:4px}
.zone-grid{display:grid;grid-template-columns:1fr;gap:10px}
